x-go-dev: &go-dev
  build:
    context: .
    dockerfile: Dockerfile
    target: development
  volumes:
    - .:/app
    - go-modules:/go/pkg/mod
    - go-build-cache:/root/.cache/go-build
  restart: unless-stopped

x-centrifugo-env: &centrifugo-env
  CENTRIFUGO_URL: http://centrifugo:8000/api
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
  CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-dev-centrifugo-token-secret}
  CENTRIFUGO_PUBLIC_WS_URL: ${CENTRIFUGO_PUBLIC_WS_URL:-ws://localhost:8000/connection/websocket}

x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-devuser}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-devpassword}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-media}
  S3_BUCKET_WORK: ${S3_BUCKET_WORK:-work}
  S3_BUCKET_RENDERS: ${S3_BUCKET_RENDERS:-renders}
  S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS:-assets}

x-pipeline-worker: &pipeline-worker
  <<: *go-dev
  env_file:
    - .env
  depends_on:
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  caddy:
    container_name: caddy
    image: caddy:2
    ports:
      - "8080:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    depends_on:
      - api
      - centrifugo
    networks: [edge]
    restart: unless-stopped

  api:
    <<: *go-dev
    container_name: api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/livez"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    ports:
      - "4000:3000"
    env_file:
      - .env
    environment:
      <<: [*centrifugo-env, *s3-env]
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      centrifugo:
        condition: service_healthy
    networks: [edge, backend, data]

  worker:
    <<: *go-dev
    container_name: worker
    command: ["go", "run", "./cmd/worker"]
    env_file:
      - .env
    environment:
      <<: *centrifugo-env
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    networks: [backend, data]

  worker-fetch:
    <<: *pipeline-worker
    container_name: worker-fetch
    command: ["go", "run", "./cmd/worker-fetch"]
    environment:
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      FETCH_CONCURRENCY: ${FETCH_CONCURRENCY:-2}
      YTDLP_BIN: ${YTDLP_BIN:-yt-dlp}
      YTDLP_MAX_FILESIZE_MB: ${YTDLP_MAX_FILESIZE_MB:-8000}
      YTDLP_MAX_DURATION_S: ${YTDLP_MAX_DURATION_S:-14400}
      YTDLP_MAX_HEIGHT: ${YTDLP_MAX_HEIGHT:-720}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
    networks: [egress, backend]

  worker-media:
    <<: *pipeline-worker
    container_name: worker-media
    command: ["go", "run", "./cmd/worker-media"]
    environment:
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      MEDIA_PREFETCH_PROBE: ${MEDIA_PREFETCH_PROBE:-4}
      MEDIA_PREFETCH_AUDIO: ${MEDIA_PREFETCH_AUDIO:-4}
      MEDIA_PREFETCH_PROXY: ${MEDIA_PREFETCH_PROXY:-1}
      MEDIA_PREFETCH_WAVEFORM: ${MEDIA_PREFETCH_WAVEFORM:-4}
    networks: [backend]

  worker-denoise:
    <<: *pipeline-worker
    container_name: worker-denoise
    command: ["go", "run", "./cmd/worker-denoise"]
    profiles: [denoise]
    networks: [backend]

  worker-transcribe:
    <<: *pipeline-worker
    container_name: worker-transcribe
    command: ["go", "run", "./cmd/worker-transcribe"]
    environment:
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-assemblyai}
      TRANSCRIBE_PREFETCH: ${TRANSCRIBE_PREFETCH:-2}
      MOCK_EXTERNAL_DIR: ${MOCK_EXTERNAL_DIR:-/app/testdata/mocks/external}
    networks: [egress, backend]

  worker-scenes:
    container_name: worker-scenes
    build:
      context: .
      dockerfile: workers/scenes/Dockerfile
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      SCENES_CONTENT_THRESHOLD: ${SCENES_CONTENT_THRESHOLD:-27}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  worker-silence:
    <<: *pipeline-worker
    container_name: worker-silence
    command: ["go", "run", "./cmd/worker-silence"]
    environment:
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      SILENCE_PREFETCH: ${SILENCE_PREFETCH:-2}
    networks: [backend]

  worker-text:
    <<: *pipeline-worker
    container_name: worker-text
    command: ["go", "run", "./cmd/worker-text"]
    environment:
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      TEXT_PREFETCH: ${TEXT_PREFETCH:-4}
    networks: [backend]

  worker-llm:
    <<: *pipeline-worker
    container_name: worker-llm
    command: ["go", "run", "./cmd/worker-llm"]
    environment:
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      LLM_PREFETCH: ${LLM_PREFETCH:-4}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MOCK_EXTERNAL_DIR: ${MOCK_EXTERNAL_DIR:-/app/testdata/mocks/external}
    networks: [egress, backend]

  worker-detect:
    <<: *pipeline-worker
    container_name: worker-detect
    command: ["go", "run", "./cmd/worker-detect"]
    profiles: [legacy]
    networks: [backend]

  worker-analyze:
    <<: *pipeline-worker
    container_name: worker-analyze
    command: ["go", "run", "./cmd/worker-analyze"]
    networks: [egress, backend]

  worker-reframe:
    container_name: worker-reframe
    build:
      context: .
      dockerfile: workers/reframe/Dockerfile
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      REFRAME_SAMPLE_FPS: ${REFRAME_SAMPLE_FPS:-5}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  worker-render:
    <<: *pipeline-worker
    container_name: worker-render
    command: ["go", "run", "./cmd/worker-render"]
    environment:
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      # Alpine font-dejavu path (drawtext/ass burn-in).
      FONTS_DIR: ${FONTS_DIR:-/usr/share/fonts/dejavu}
    networks: [backend]

  worker-translate:
    <<: *pipeline-worker
    container_name: worker-translate
    command: ["go", "run", "./cmd/worker-translate"]
    networks: [egress, backend]

  database:
    container_name: datastore
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "9543:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks: [data]
    restart: unless-stopped

  rabbitmq:
    container_name: broker
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "9002:5672"
      - "9003:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Raise consumer_timeout for long worker-render ffmpeg jobs (see rabbitmq/rabbitmq.conf).
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [backend]
    restart: unless-stopped

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v5
    # Mount the file (not the directory): Docker Desktop/WSL often bind-mounts an empty
    # dir on first boot → Centrifugo starts with no namespaces → unknown channel 102.
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    ports:
      - "8000:8000"
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:-dev-centrifugo-token-secret}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:3000 http://localhost:3001}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [edge, backend]
    restart: unless-stopped

  ngrok:
    container_name: ngrok
    image: ngrok/ngrok:latest
    command: http --url=${NGROK_DOMAIN} --host-header=${NGROK_DOMAIN} http://api:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped

  minio:
    container_name: s3
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set local http://127.0.0.1:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready local",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-devuser}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-devpassword}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks: [backend]
    restart: unless-stopped

  mc:
    container_name: mc
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo 'waiting for minio...';
      until mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-devuser} ${S3_SECRET_KEY:-devpassword}; do sleep 1; done;
      mc mb myminio/${S3_BUCKET_MEDIA:-media} --ignore-existing;
      mc mb myminio/${S3_BUCKET_WORK:-work} --ignore-existing;
      mc mb myminio/${S3_BUCKET_RENDERS:-renders} --ignore-existing;
      mc mb myminio/${S3_BUCKET_ASSETS:-assets} --ignore-existing;
      printf '%s' '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","POST","HEAD","DELETE"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag","etag","x-amz-request-id"],"MaxAgeSeconds":3600}]}' > /tmp/cors.json;
      mc cors set myminio/${S3_BUCKET_MEDIA:-media} /tmp/cors.json 2>/dev/null || true;
      mc ilm rule add --expire-days 3 myminio/${S3_BUCKET_WORK:-work} 2>/dev/null ||
        mc ilm add --expiry-days 3 myminio/${S3_BUCKET_WORK:-work} 2>/dev/null ||
        true;
      # Renders are not auto-expired (download URLs would break). Use: make purge-retention
      mc version enable myminio/${S3_BUCKET_ASSETS:-assets} || true;
      mc admin config set myminio notify_webhook:media endpoint='http://api:3000/webhooks/minio/object-created' auth_token='${MINIO_WEBHOOK_SECRET:-dev-minio-webhook-secret}' || true;
      mc admin service restart myminio --json || true;
      sleep 5;
      mc event remove myminio/${S3_BUCKET_MEDIA:-media} --force || true;
      for ext in jpg jpeg png webp mp4 mov avi mkv m4v mpeg mpg wmv asf flv webm ogg ogv mka wav flac m4a; do
        mc event add myminio/${S3_BUCKET_MEDIA:-media} arn:minio:sqs::media:webhook --event put --suffix .$$ext -p || true;
      done;
      echo 'minio init done';
      "
    networks: [backend]

volumes:
  go-modules:
  go-build-cache:
  database_data:
  rabbitmq_data:
  minio_data:

networks:
  edge:
  backend:
  data:
  egress:
