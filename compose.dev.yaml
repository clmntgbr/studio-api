x-go-dev: &go-dev
  build:
    context: .
    dockerfile: Dockerfile
    target: development
  volumes:
    - .:/app
    - go-modules:/go/pkg/mod
    - go-build-cache:/root/.cache/go-build
  restart: unless-stopped

x-centrifugo-env: &centrifugo-env
  CENTRIFUGO_URL: http://centrifugo:8000/api
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
  CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-dev-centrifugo-token-secret}
  CENTRIFUGO_PUBLIC_WS_URL: ${CENTRIFUGO_PUBLIC_WS_URL:-ws://localhost:8000/connection/websocket}

x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-devuser}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-devpassword}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-media}
  S3_BUCKET_WORK: ${S3_BUCKET_WORK:-work}
  S3_BUCKET_RENDERS: ${S3_BUCKET_RENDERS:-renders}
  S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS:-assets}

x-pipeline-worker: &pipeline-worker
  <<: *go-dev
  env_file:
    - .env
  depends_on:
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  caddy:
    container_name: caddy
    image: caddy:2
    ports:
      - "8080:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    depends_on:
      - api
      - centrifugo
    networks: [edge]
    restart: unless-stopped

  api:
    <<: *go-dev
    container_name: api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/livez"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    ports:
      - "4000:3000"
    env_file:
      - .env
    environment:
      <<: [*centrifugo-env, *s3-env]
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      centrifugo:
        condition: service_started
    networks: [edge, backend, data]

  worker:
    <<: *go-dev
    container_name: worker
    command: ["go", "run", "./cmd/worker"]
    env_file:
      - .env
    environment:
      <<: *centrifugo-env
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      centrifugo:
        condition: service_started
    networks: [backend, data]

  worker-ingest:
    <<: *pipeline-worker
    container_name: worker-ingest
    command: ["go", "run", "./cmd/worker-ingest"]
    networks: [egress, backend]

  worker-audio:
    <<: *pipeline-worker
    container_name: worker-audio
    command: ["go", "run", "./cmd/worker-audio"]
    networks: [backend]

  worker-denoise:
    <<: *pipeline-worker
    container_name: worker-denoise
    command: ["go", "run", "./cmd/worker-denoise"]
    profiles: [denoise]
    networks: [backend]

  worker-transcribe:
    <<: *pipeline-worker
    container_name: worker-transcribe
    command: ["go", "run", "./cmd/worker-transcribe"]
    networks: [egress, backend]

  worker-scenes:
    <<: *pipeline-worker
    container_name: worker-scenes
    command: ["go", "run", "./cmd/worker-scenes"]
    networks: [egress, backend]

  worker-detect:
    <<: *pipeline-worker
    container_name: worker-detect
    command: ["go", "run", "./cmd/worker-detect"]
    networks: [backend]

  worker-analyze:
    <<: *pipeline-worker
    container_name: worker-analyze
    command: ["go", "run", "./cmd/worker-analyze"]
    networks: [egress, backend]

  worker-reframe:
    <<: *pipeline-worker
    container_name: worker-reframe
    command: ["go", "run", "./cmd/worker-reframe"]
    networks: [backend]

  worker-render:
    <<: *pipeline-worker
    container_name: worker-render
    command: ["go", "run", "./cmd/worker-render"]
    networks: [backend]

  worker-translate:
    <<: *pipeline-worker
    container_name: worker-translate
    command: ["go", "run", "./cmd/worker-translate"]
    networks: [egress, backend]

  worker-upscale:
    <<: *pipeline-worker
    container_name: worker-upscale
    command: ["go", "run", "./cmd/worker-upscale"]
    profiles: [gpu]
    networks: [backend]

  worker-dub:
    <<: *pipeline-worker
    container_name: worker-dub
    command: ["go", "run", "./cmd/worker-dub"]
    profiles: [gpu]
    networks: [backend]

  database:
    container_name: datastore
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "9543:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks: [data]
    restart: unless-stopped

  rabbitmq:
    container_name: broker
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "9002:5672"
      - "9003:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [backend]
    restart: unless-stopped

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v5
    command: ["centrifugo", "-c", "config.json"]
    ports:
      - "8000:8000"
    volumes:
      - ./centrifugo:/centrifugo:ro
    working_dir: /centrifugo
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:-dev-centrifugo-token-secret}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:3000 http://localhost:3001}
    networks: [edge, backend]
    restart: unless-stopped

  ngrok:
    container_name: ngrok
    image: ngrok/ngrok:latest
    command: ["http", "--url=${NGROK_DOMAIN}", "http://api:3000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped

  minio:
    container_name: s3
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set local http://127.0.0.1:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready local",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-devuser}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-devpassword}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks: [backend]
    restart: unless-stopped

  mc:
    container_name: mc
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo 'waiting for minio...';
      until mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-devuser} ${S3_SECRET_KEY:-devpassword}; do sleep 1; done;
      mc mb myminio/${S3_BUCKET_MEDIA:-media} --ignore-existing;
      mc mb myminio/${S3_BUCKET_WORK:-work} --ignore-existing;
      mc mb myminio/${S3_BUCKET_RENDERS:-renders} --ignore-existing;
      mc mb myminio/${S3_BUCKET_ASSETS:-assets} --ignore-existing;
      mc ilm rule add --expire-days 3 myminio/${S3_BUCKET_WORK:-work} 2>/dev/null ||
        mc ilm add --expiry-days 3 myminio/${S3_BUCKET_WORK:-work} 2>/dev/null ||
        true;
      mc version enable myminio/${S3_BUCKET_ASSETS:-assets} || true;
      mc admin config set myminio notify_webhook:media endpoint='http://api:3000/webhooks/minio/object-created' auth_token='${MINIO_WEBHOOK_SECRET:-}' || true;
      mc admin service restart myminio --json || true;
      sleep 5;
      mc event remove myminio/${S3_BUCKET_MEDIA:-media} --force || true;
      for ext in jpg jpeg png webp mp4 mov avi mkv m4v mpeg mpg wmv asf flv webm ogg ogv mka wav flac m4a; do
        mc event add myminio/${S3_BUCKET_MEDIA:-media} arn:minio:sqs::media:webhook --event put --suffix .$$ext -p || true;
      done;
      echo 'minio init done';
      "
    networks: [backend]

volumes:
  go-modules:
  go-build-cache:
  database_data:
  rabbitmq_data:
  minio_data:

networks:
  edge:
  backend:
  data:
  egress:
