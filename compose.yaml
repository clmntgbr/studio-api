x-go-prod: &go-prod
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  restart: unless-stopped

x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-media}
  S3_BUCKET_WORK: ${S3_BUCKET_WORK:-work}
  S3_BUCKET_RENDERS: ${S3_BUCKET_RENDERS:-renders}
  S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS:-assets}

x-app-env: &app-env
  GO_ENV: ${GO_ENV}
  PORT: ${PORT}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS}
  CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS}
  CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS}
  CORS_MAX_AGE: ${CORS_MAX_AGE}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
  CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
  CLERK_FRONTEND_API: ${CLERK_FRONTEND_API}
  CENTRIFUGO_URL: ${CENTRIFUGO_URL}
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
  CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET}
  CENTRIFUGO_PUBLIC_WS_URL: ${CENTRIFUGO_PUBLIC_WS_URL}
  RABBITMQ_URL: ${RABBITMQ_URL}
  RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
  RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
  RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY}
  RABBITMQ_RETRY_TTL_MS: ${RABBITMQ_RETRY_TTL_MS}

x-pipeline-worker: &pipeline-worker
  <<: *go-prod
  environment:
    RABBITMQ_URL: ${RABBITMQ_URL}
  depends_on:
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      SITE_ADDRESS: ${CADDY_SITE_ADDRESS}
    networks: [edge]
    restart: unless-stopped

  api:
    <<: *go-prod
    command: ["./api"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/livez"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      <<: [*app-env, *s3-env]
      TRUST_PROXY: "true"
      DATABASE_URL: ${API_DATABASE_URL:-${DATABASE_URL}}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      centrifugo:
        condition: service_started
    networks: [edge, backend, data]
    deploy:
      replicas: 2

  worker:
    <<: *go-prod
    command: ["./worker"]
    environment:
      <<: *app-env
      DATABASE_URL: ${WORKER_DATABASE_URL:-${DATABASE_URL}}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      centrifugo:
        condition: service_started
    networks: [backend, data]
    deploy:
      replicas: 2

  worker-fetch:
    <<: *pipeline-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-fetch
    command: ["./worker-fetch"]
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      FETCH_CONCURRENCY: ${FETCH_CONCURRENCY:-2}
      YTDLP_BIN: ${YTDLP_BIN:-yt-dlp}
      YTDLP_MAX_FILESIZE_MB: ${YTDLP_MAX_FILESIZE_MB:-8000}
      YTDLP_MAX_DURATION_S: ${YTDLP_MAX_DURATION_S:-14400}
      YTDLP_MAX_HEIGHT: ${YTDLP_MAX_HEIGHT:-720}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
    networks: [egress, backend]
    deploy:
      replicas: 1

  worker-media:
    <<: *pipeline-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-media
    command: ["./worker-media"]
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      MEDIA_PREFETCH_PROBE: ${MEDIA_PREFETCH_PROBE:-4}
      MEDIA_PREFETCH_AUDIO: ${MEDIA_PREFETCH_AUDIO:-4}
      MEDIA_PREFETCH_PROXY: ${MEDIA_PREFETCH_PROXY:-1}
      MEDIA_PREFETCH_WAVEFORM: ${MEDIA_PREFETCH_WAVEFORM:-4}
    networks: [backend]
    deploy:
      replicas: 1

  worker-denoise:
    <<: *pipeline-worker
    command: ["./worker-denoise"]
    profiles: [denoise]
    networks: [backend]

  worker-transcribe:
    <<: *pipeline-worker
    command: ["./worker-transcribe"]
    environment:
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-assemblyai}
      TRANSCRIBE_PREFETCH: ${TRANSCRIBE_PREFETCH:-2}
      MOCK_EXTERNAL_DIR: ${MOCK_EXTERNAL_DIR:-/app/testdata/mocks/external}
    networks: [egress, backend]
    deploy:
      replicas: 2

  worker-scenes:
    build:
      context: .
      dockerfile: workers/scenes/Dockerfile
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      SCENES_CONTENT_THRESHOLD: ${SCENES_CONTENT_THRESHOLD:-27}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    deploy:
      replicas: 1

  worker-silence:
    <<: *pipeline-worker
    command: ["./worker-silence"]
    environment:
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      SILENCE_PREFETCH: ${SILENCE_PREFETCH:-2}
    networks: [backend]
    deploy:
      replicas: 2

  worker-text:
    <<: *pipeline-worker
    command: ["./worker-text"]
    environment:
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      TEXT_PREFETCH: ${TEXT_PREFETCH:-4}
    networks: [backend]
    deploy:
      replicas: 2

  worker-llm:
    <<: *pipeline-worker
    command: ["./worker-llm"]
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      LLM_PREFETCH: ${LLM_PREFETCH:-4}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MOCK_EXTERNAL_DIR: ${MOCK_EXTERNAL_DIR:-/app/testdata/mocks/external}
    networks: [egress, backend]
    deploy:
      replicas: 2

  worker-detect:
    <<: *pipeline-worker
    command: ["./worker-detect"]
    profiles: [legacy]
    networks: [backend]

  worker-analyze:
    <<: *pipeline-worker
    command: ["./worker-analyze"]
    networks: [egress, backend]
    deploy:
      replicas: 2

  worker-reframe:
    build:
      context: .
      dockerfile: workers/reframe/Dockerfile
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      REFRAME_SAMPLE_FPS: ${REFRAME_SAMPLE_FPS:-5}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    deploy:
      replicas: 1

  worker-render:
    <<: *pipeline-worker
    command: ["./worker-render"]
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      <<: *s3-env
      WORK_DIR: ${WORK_DIR:-/tmp/work}
      FONTS_DIR: ${FONTS_DIR:-/fonts}
    networks: [backend]

  worker-translate:
    <<: *pipeline-worker
    command: ["./worker-translate"]
    networks: [egress, backend]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [backend]
    restart: unless-stopped

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set local http://127.0.0.1:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready local",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks: [backend]
    restart: unless-stopped

  mc:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo 'waiting for minio...';
      until mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}; do sleep 1; done;
      mc mb myminio/${S3_BUCKET_MEDIA:-media} --ignore-existing;
      mc mb myminio/${S3_BUCKET_WORK:-work} --ignore-existing;
      mc mb myminio/${S3_BUCKET_RENDERS:-renders} --ignore-existing;
      mc mb myminio/${S3_BUCKET_ASSETS:-assets} --ignore-existing;
      printf '%s' '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","POST","HEAD","DELETE"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag","etag","x-amz-request-id"],"MaxAgeSeconds":3600}]}' > /tmp/cors.json;
      mc cors set myminio/${S3_BUCKET_MEDIA:-media} /tmp/cors.json 2>/dev/null || true;
      mc ilm rule add --expire-days 3 myminio/${S3_BUCKET_WORK:-work} 2>/dev/null ||
        mc ilm add --expiry-days 3 myminio/${S3_BUCKET_WORK:-work} 2>/dev/null ||
        true;
      # Renders are not auto-expired (download URLs would break). Use: make purge-retention
      mc version enable myminio/${S3_BUCKET_ASSETS:-assets} || true;
      mc admin config set myminio notify_webhook:media endpoint='http://api:3000/webhooks/minio/object-created' auth_token='${MINIO_WEBHOOK_SECRET:-dev-minio-webhook-secret}' || true;
      mc admin service restart myminio --json || true;
      sleep 5;
      mc event remove myminio/${S3_BUCKET_MEDIA:-media} --force || true;
      for ext in jpg jpeg png webp mp4 mov avi mkv m4v mpeg mpg wmv asf flv webm ogg ogv mka wav flac m4a; do
        mc event add myminio/${S3_BUCKET_MEDIA:-media} arn:minio:sqs::media:webhook --event put --suffix .$$ext -p || true;
      done;
      echo 'minio init done';
      "
    networks: [backend]

  centrifugo:
    image: centrifugo/centrifugo:v5
    # Mount the file (not the directory): empty dir mounts drop namespaces → channel 102.
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [edge, backend]
    restart: unless-stopped

  database:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$$POSTGRES_DB\" -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true
  data:
    internal: true
  egress:

volumes:
  rabbitmq_data:
  minio_data:
  pgdata:
  caddy_data:
