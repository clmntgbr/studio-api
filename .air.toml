root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -buildvcs=false -o ./tmp/main ./cmd/api"
bin = "./tmp/main"
include_ext = ["go", "tpl", "tmpl", "html", "env"]
exclude_dir = ["tmp", "vendor", "node_modules", ".git", "testdata", "assets", "docs", "bin"]
exclude_regex = ["_test.go"]
exclude_file = ["tmp/main", "tmp/main-prev", "coverage.out", "coverage.html"]
delay = 1000
stop_on_error = true

[log]
time = true
